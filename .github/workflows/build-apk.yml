name: Build Native Android Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Kotlin APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: |
          touch .env
          yes | sdkmanager --licenses || true

      - name: Setup Embedded Debug Keystore
        run: |
          echo "" | base64 -d > debug.keystore
          ls -la debug.keystore

      - name: Download Gradle 9.3.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle-bin.zip
          unzip -q gradle-bin.zip

      - name: Build Debug APK
        run: |
          ./gradle-9.3.1/bin/gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowstudy-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
